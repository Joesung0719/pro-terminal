name: tmp-options-probe
on:
  push:
    branches: [claude/project-thread-pr1bhn]
    paths: [".github/workflows/tmp-options-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q -r requirements.txt 2>&1 | tail -2
      - name: probe
        run: |
          python - <<'PY'
          import requests, json
          import main as m
          for sym in ["PLTR","SPCX","SPY"]:
              print("=====", sym)
              for host in m._CBOE_HOSTS:
                  try:
                      r = requests.get(f"{host}/api/global/delayed_quotes/options/{sym}.json", headers=m._BROWSER_HEADERS, timeout=20)
                      print("cboe", host, r.status_code, len(r.content), r.text[:80].replace("\n"," "))
                  except Exception as e: print("cboe", host, "ERR", e)
              try:
                  r = requests.get(f"https://api.nasdaq.com/api/quote/{sym}/option-chain", params={"assetclass":"stocks","limit":5}, headers={**m._BROWSER_HEADERS,"Referer":"https://www.nasdaq.com/"}, timeout=20)
                  print("nasdaq raw", r.status_code, len(r.content), r.text[:200].replace("\n"," "))
              except Exception as e: print("nasdaq raw ERR", e)
              try:
                  e = list(m.yf.Ticker(sym).options or [])
                  print("yahoo(yfinance) expirations:", len(e), e[:3])
              except Exception as ex: print("yahoo ERR", type(ex).__name__, str(ex)[:150])
              for name, fn in (("new _cboe_options", m._cboe_options), ("new _nasdaq_options", m._nasdaq_options)):
                  d = fn(sym)
                  print(name, "expirations:", len(d) if d else 0, list(d)[:3] if d else m._LAST_ERR)
              e = m._expirations(sym)
              print("app _expirations ->", len(e), "source:", m._OPT_SRC.get(sym))
              print("api:", json.dumps(m.get_option_expirations(sym), ensure_ascii=False)[:300])
          PY
