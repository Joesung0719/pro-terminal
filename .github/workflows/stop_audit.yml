# 停損被洗檢討（一次性分析，不影響推播）：手動或修改分析程式時執行，輸出 backtest_reports/stop_audit.md
name: stop-audit

on:
  workflow_dispatch:
  push:
    paths:
      - "us/stop_audit.py"
      - ".github/workflows/stop_audit.yml"

permissions:
  contents: write

concurrency:
  group: stop-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas numpy yfinance tzdata
      - name: Run stop audit
        run: |
          python us/stop_audit.py
          cat backtest_reports/stop_audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add backtest_reports/stop_audit.md
          git diff --cached --quiet && exit 0
          git commit -m "Stop audit report [skip render]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
