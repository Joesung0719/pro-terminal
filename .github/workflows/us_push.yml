# 美股 LINE 推播（GitHub Actions 排程）
# 放在 repo 的 .github/workflows/us_push.yml（與 us_scheduler.py 同一個 repo、同一層）
# 需要在 repo 的 Settings → Secrets and variables → Actions 新增：
#   LINE_CHANNEL_TOKEN、LINE_USER_ID（必填）、US_APP_URL（選填，預設 https://pro-terminal.onrender.com）
# 排程用 UTC。夏令(3月中–11月初)美東=UTC-4、冬令=UTC-5，所以每個時段排兩個 UTC 時間，
# 由 us_scheduler.py auto 依「美東當下幾點」只執行對的那一個，另一個自動略過。
name: us-line-push

on:
  schedule:
    - cron: "5 14,15 * * 1-5"    # 美東 10:05 附近 → 開盤半小時戰報
    - cron: "35 16,17 * * 1-5"   # 美東 12:35 附近 → 午盤戰報
    - cron: "20 20,21 * * 1-5"   # 美東 16:20 附近 → 收盤結算
  workflow_dispatch:
    inputs:
      cmd:
        description: "手動執行：test / stage1 / stage2 / stage3 / auto"
        default: "test"

# 收盤戰報推播後把「推播了哪幾檔」寫進 tracking/us_push_log.csv 並提交（推播績效追蹤用）
permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas numpy yfinance tzdata gspread google-auth
      - name: Run
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          US_APP_URL: ${{ secrets.US_APP_URL }}
          ASSET_BASE: ${{ secrets.ASSET_BASE }}
          # 推播績效追蹤寫入 Google 試算表（未設定時暫存 tracking/us_push_log.csv）
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PUSH_SHEET_ID: ${{ secrets.PUSH_SHEET_ID }}
        run: python us/us_scheduler.py ${{ github.event.inputs.cmd || 'auto' }}

      # 推播紀錄只新增不修改；.gitattributes 設定 merge=union，和其他排程同時提交也不會衝突
      # 這一步失敗不影響已送出的推播
      - name: Commit push log
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add tracking/us_push_log.csv 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          # [skip render]：只是資料更新，不觸發 Render 重新部署
          git commit -m "Record US LINE push ($(TZ=America/New_York date '+%F %H:%M')) [skip render]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git rebase --abort 2>/dev/null; sleep $((i * 5))
          done
          exit 1
