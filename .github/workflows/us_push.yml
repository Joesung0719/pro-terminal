# 美股 LINE 推播（GitHub Actions 排程）
# 放在 repo 的 .github/workflows/us_push.yml（與 us_scheduler.py 同一個 repo、同一層）
# 需要在 repo 的 Settings → Secrets and variables → Actions 新增：
#   LINE_CHANNEL_TOKEN、LINE_USER_ID（必填）、US_APP_URL（選填，預設 https://pro-terminal.onrender.com）
#   ACCOUNT_USD（選填，本金美元數字；沒設定就不顯示股數，不會用預設數字。建議放 Secrets，不要放公開的 Variables）
#   RISK_PER_TRADE_PCT／TOTAL_RISK_CAP_PCT／MONTH_STOP_PCT（選填，預設 1／5／5，單位 %）
# 排程用 UTC。夏令(3月中–11月初)美東=UTC-4、冬令=UTC-5，所以每個時段排兩個 UTC 時間，
# 由 us_scheduler.py auto 依「這班的預定時間換成美東是幾點」只執行對的那一個，另一個自動略過。
# 每個 UTC 時間要分開寫一行（auto 靠 github.event.schedule 分辨是哪一班），GitHub 延遲再久也不會重複或漏推。
#   每個交易日只推開盤半小時與收盤兩則（午盤已停推）。
#   夏令 EDT：開盤半小時 14:05、收盤 20:20 UTC（台北 22:05／04:20）
#   冬令 EST：開盤半小時 15:05、收盤 21:20 UTC（台北 23:05／05:20）
name: us-line-push

on:
  schedule:
    - cron: "5 14 * * 1-5"    # 夏令 美東 10:05 → 開盤半小時戰報
    - cron: "5 15 * * 1-5"    # 冬令 美東 10:05 → 開盤半小時戰報
    - cron: "20 20 * * 1-5"   # 夏令 美東 16:20 → 收盤結算
    - cron: "20 21 * * 1-5"   # 冬令 美東 16:20 → 收盤結算
  workflow_dispatch:
    inputs:
      cmd:
        description: "手動執行：test / stage1 / stage3 / auto（stage2 午盤已停排程，只供測試）"
        default: "test"

# 收盤戰報推播後把「推播了哪幾檔」寫進 tracking/us_push_log.csv 並提交（推播績效追蹤用）
permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas numpy yfinance tzdata gspread google-auth
      - name: Run
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          US_APP_URL: ${{ secrets.US_APP_URL }}
          ASSET_BASE: ${{ secrets.ASSET_BASE }}
          SCHEDULE: ${{ github.event.schedule }}
          ACCOUNT_USD: ${{ secrets.ACCOUNT_USD }}
          RISK_PER_TRADE_PCT: ${{ secrets.RISK_PER_TRADE_PCT }}
          TOTAL_RISK_CAP_PCT: ${{ secrets.TOTAL_RISK_CAP_PCT }}
          MONTH_STOP_PCT: ${{ secrets.MONTH_STOP_PCT }}
          # 推播績效追蹤寫入 Google 試算表（未設定時暫存 tracking/us_push_log.csv）
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PUSH_SHEET_ID: ${{ secrets.PUSH_SHEET_ID }}
        run: python us/us_scheduler.py ${{ github.event.inputs.cmd || 'auto' }}

      # 推播紀錄只新增不修改；.gitattributes 設定 merge=union，和其他排程同時提交也不會衝突
      # 這一步失敗不影響已送出的推播
      - name: Commit push log
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add tracking/us_push_log.csv 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          # [skip render]：只是資料更新，不觸發 Render 重新部署
          git commit -m "Record US LINE push ($(TZ=America/New_York date '+%F %H:%M')) [skip render]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git rebase --abort 2>/dev/null; sleep $((i * 5))
          done
          exit 1
