# 空方恐慌日過濾回測（一次性分析，不影響推播），輸出 backtest_reports/panic_filter.md
name: panic-filter-test
on:
  workflow_dispatch:
  push:
    paths:
      - "us/panic_filter_test.py"
      - ".github/workflows/panic_filter.yml"
permissions:
  contents: write
concurrency:
  group: panic-filter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas numpy yfinance tzdata
      - run: |
          python us/panic_filter_test.py
          cat backtest_reports/panic_filter.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add backtest_reports/panic_filter.md
          git diff --cached --quiet && exit 0
          git commit -m "Panic filter report [skip render]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
